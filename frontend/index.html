<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2eedf" />
    <title>Tip Jar</title>
    <script src="./config.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Tip Jar home">
          <span class="brand-mark" aria-hidden="true">T</span>
          <span>Tip Jar</span>
        </a>
        <button class="wallet-button" id="connectButton" type="button">
          Connect wallet
        </button>
      </header>

      <section class="hero">
        <div class="intro">
          <p class="kicker">Programmable on-chain savings</p>
          <h1>Save for<br /><em>something.</em></h1>
          <p class="lede">
            Create a jar, accept tips, and unlock funds by amount or date.
          </p>

          <div class="jar-figure" aria-label="A stylized tip jar">
            <div class="coin coin-one">Ξ</div>
            <div class="coin coin-two">Ξ</div>
            <div class="jar-lid"></div>
            <div class="jar-neck"></div>
            <div class="jar-body"><span id="jarBalance">0 ETH</span></div>
          </div>
        </div>

        <aside class="tip-panel" aria-label="Send a tip">
          <div class="panel-heading">
            <span id="jarTitle">Choose a jar</span>
            <span class="currency" id="networkName">ETH</span>
          </div>

          <div class="jar-progress">
            <div class="progress-track">
              <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="progress-copy">
              <span id="progressAmount">No target set</span>
              <span id="unlockDate">No date set</span>
            </div>
          </div>

          <div class="amount-grid" role="radiogroup" aria-label="Tip amount">
            <button class="amount-button" type="button" data-amount="0.001" role="radio" aria-checked="false">0.001</button>
            <button class="amount-button selected" type="button" data-amount="0.005" role="radio" aria-checked="true">0.005</button>
            <button class="amount-button" type="button" data-amount="0.01" role="radio" aria-checked="false">0.01</button>
          </div>

          <label class="field-label" for="amountInput">Other amount</label>
          <div class="amount-input-wrap">
            <input id="amountInput" type="number" min="0" step="0.001" value="0.005" inputmode="decimal" />
            <span>ETH</span>
          </div>

          <label class="field-label" for="messageInput">Add a note</label>
          <textarea id="messageInput" maxlength="280" rows="3" placeholder="Thanks for making this!"></textarea>

          <button class="send-button" id="sendButton" type="button">
            <span id="sendButtonText">Send tip</span>
            <span aria-hidden="true">→</span>
          </button>

          <button class="withdraw-button" id="withdrawButton" type="button" disabled>
            Withdraw
          </button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </aside>
      </section>

      <section class="create-jar-section">
        <div class="activity-heading">
          <h2>Create a jar</h2>
        </div>
        <div class="jar-factory-settings">
          <div class="create-row">
            <label>
              Jar name
              <input id="jarNameInput" type="text" maxlength="40" placeholder="Studio fund" />
            </label>
            <label>
              Target amount
              <input id="targetInput" type="number" min="0" step="0.001" placeholder="No target" />
              <span>ETH</span>
            </label>
            <label>
              Unlock date
              <input id="dateInput" type="datetime-local" />
            </label>
            <button id="createJarButton" type="button">Create jar</button>
          </div>
        </div>
      </section>

      <section class="activity">
        <div class="activity-heading">
          <h2>Jars</h2>
          <button class="text-button" id="refreshButton" type="button">Refresh</button>
        </div>

        <div class="jar-filters" aria-label="Filter jars">
          <button class="jar-filter active" type="button" data-filter="all">All</button>
          <button class="jar-filter" type="button" data-filter="mine">Created by me</button>
          <button class="jar-filter" type="button" data-filter="name">By name</button>
          <input
            id="nameFilter"
            type="text"
            placeholder="Search jar name"
            spellcheck="false"
            hidden
          />
        </div>

        <div class="jar-list" id="jarList">
          <div class="empty-state"><span>No jars selected.</span></div>
        </div>

        <div class="activity-heading recent-heading">
          <h2>Recent tips</h2>
        </div>
        <div class="tips-list" id="tipsList">
          <div class="empty-state"><span>Select a jar to see its tips.</span></div>
        </div>
      </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
    <script>
      const FACTORY_ABI = [
        "function createJar(string name, uint256 targetAmount, uint256 unlockTime) returns (address)",
        "function getJarCount() view returns (uint256)",
        "function getJar(uint256 index) view returns (address)",
        "function getOwnerJarCount(address owner) view returns (uint256)",
        "function getOwnerJar(address owner, uint256 index) view returns (address)",
        "event JarCreated(address indexed owner, address indexed jar, string name, uint256 targetAmount, uint256 unlockTime)"
      ];

      const JAR_ABI = [
        "function owner() view returns (address)",
        "function name() view returns (string)",
        "function targetAmount() view returns (uint256)",
        "function unlockTime() view returns (uint256)",
        "function withdrawn() view returns (bool)",
        "function canWithdraw() view returns (bool)",
        "function tip(string message) payable",
        "function withdraw()",
        "function getTipsCount() view returns (uint256)",
        "function getTip(uint256 index) view returns (tuple(address sender, uint256 amount, string message, uint256 timestamp))",
        "event Tipped(address indexed sender, uint256 amount, string message)"
      ];

      const state = {
        provider: null,
        signer: null,
        factoryAddress: window.TIP_JAR_FACTORY_ADDRESS || "",
        jarAddress: localStorage.getItem("selectedTipJarAddress") || "",
        jarFilter: "all",
        nameFilter: ""
      };

      const connectButton = document.getElementById("connectButton");
      const sendButton = document.getElementById("sendButton");
      const sendButtonText = document.getElementById("sendButtonText");
      const withdrawButton = document.getElementById("withdrawButton");
      const amountInput = document.getElementById("amountInput");
      const messageInput = document.getElementById("messageInput");
      const statusElement = document.getElementById("status");
      const factoryInput = document.getElementById("factoryInput");
      const jarList = document.getElementById("jarList");
      const tipsList = document.getElementById("tipsList");

      function setStatus(message, kind = "") {
        statusElement.textContent = message;
        statusElement.className = `status${kind ? ` ${kind}` : ""}`;
      }

      function getRpcError(error) {
        return (
          error?.revert?.reason ||
          error?.info?.error?.message ||
          error?.error?.message ||
          error?.shortMessage ||
          error?.reason ||
          error?.message ||
          "The wallet or RPC provider returned an unknown error."
        );
      }

      function shortenAddress(address) {
        return `${address.slice(0, 6)}…${address.slice(-4)}`;
      }

      function etherscanAddressUrl(address) {
        return `https://sepolia.etherscan.io/address/${address}`;
      }

      function etherscanTransactionUrl(hash) {
        return `https://sepolia.etherscan.io/tx/${hash}`;
      }

      function formatDate(timestamp) {
        if (!timestamp) return "No date set";
        return new Intl.DateTimeFormat(undefined, {
          month: "short", day: "numeric", year: "numeric",
          hour: "numeric", minute: "2-digit"
        }).format(new Date(Number(timestamp) * 1000));
      }

      function getFactory(signerOrProvider = state.provider) {
        if (!state.factoryAddress) throw new Error("Enter a deployed factory address.");
        return new ethers.Contract(state.factoryAddress, FACTORY_ABI, signerOrProvider);
      }

      function getJar(signerOrProvider = state.provider) {
        if (!state.jarAddress) throw new Error("Select or create a jar.");
        return new ethers.Contract(state.jarAddress, JAR_ABI, signerOrProvider);
      }

      function ensureProvider() {
        if (!state.provider && window.ethereum) {
          state.provider = new ethers.BrowserProvider(window.ethereum);
        }
        return state.provider;
      }

      async function connectWallet() {
        if (!window.ethereum) {
          setStatus("Install MetaMask or another Ethereum wallet.", "error");
          return;
        }

        try {
          state.provider = new ethers.BrowserProvider(window.ethereum);
          await state.provider.send("eth_requestAccounts", []);
          state.signer = await state.provider.getSigner();
          const address = await state.signer.getAddress();
          const network = await state.provider.getNetwork();
          connectButton.textContent = shortenAddress(address);
          document.getElementById("networkName").textContent =
            network.name === "unknown" ? `Chain ${network.chainId}` : network.name;
          setStatus("Wallet connected.");
          await loadJars();
          await loadSelectedJar();
        } catch (error) {
          setStatus(getRpcError(error), "error");
        }
      }

      async function loadJars() {
        if (!state.factoryAddress) return;

        try {
          ensureProvider();
          const factory = getFactory(state.provider);
          const count = await factory.getJarCount();
          const allAddresses = await Promise.all(
            Array.from({ length: Number(count) }, (_, index) =>
              factory.getJar(index))
          );

          if (allAddresses.length === 0) {
            jarList.innerHTML =
              `<div class="empty-state"><span>No jars have been created yet.</span></div>`;
            return;
          }

          const jarOwners = await Promise.all(
            allAddresses.map((address) =>
              new ethers.Contract(address, JAR_ABI, state.provider).owner())
          );
          const jarNames = await Promise.all(
            allAddresses.map((address) =>
              new ethers.Contract(address, JAR_ABI, state.provider).name())
          );

          let addresses = allAddresses;
          if (state.jarFilter === "mine") {
            if (!state.signer) {
              jarList.innerHTML =
                `<div class="empty-state"><span>Connect your wallet to see jars you created.</span></div>`;
              return;
            }
            const currentAddress = await state.signer.getAddress();
            addresses = allAddresses.filter((_, index) =>
              jarOwners[index].toLowerCase() === currentAddress.toLowerCase());
          } else if (state.jarFilter === "name") {
            const nameQuery = state.nameFilter.trim().toLowerCase();
            if (!nameQuery) {
              jarList.innerHTML =
                `<div class="empty-state"><span>Enter a jar name to filter jars.</span></div>`;
              return;
            }
            addresses = allAddresses.filter((_, index) =>
              jarNames[index].toLowerCase().includes(nameQuery));
          }

          if (addresses.length === 0) {
            jarList.innerHTML =
              `<div class="empty-state"><span>No jars match this filter.</span></div>`;
            return;
          }

          jarList.innerHTML = addresses.map((address) => {
            const index = allAddresses.indexOf(address);
            return `
          <div class="jar-row${address === state.jarAddress ? " active" : ""}" data-address="${address}">
              <span>${escapeHtml(jarNames[index])}</span>
            <span>
              <a class="etherscan-link" href="${etherscanAddressUrl(address)}" target="_blank" rel="noopener noreferrer" data-address-link="true">Etherscan</a>
              <button class="jar-open-button" type="button" data-address="${address}">Open jar →</button>
            </span>
          </div>
          `}).join("");

          document.querySelectorAll(".jar-open-button").forEach((button) => {
            button.addEventListener("click", () => {
              state.jarAddress = button.dataset.address;
              localStorage.setItem("selectedTipJarAddress", state.jarAddress);
              loadJars();
              loadSelectedJar();
            });
          });

          if (!state.jarAddress && addresses[0]) {
            state.jarAddress = addresses[0];
            localStorage.setItem("selectedTipJarAddress", state.jarAddress);
            await loadJars();
            await loadSelectedJar();
          }
        } catch (error) {
          setStatus(getRpcError(error) || "Could not load your jars.", "error");
        }
      }

      async function loadSelectedJar() {
        if (!state.jarAddress) return;

        try {
          ensureProvider();
          const jar = getJar(state.provider);
          const [name, target, unlock, balance, withdrawn, unlocked, owner] =
            await Promise.all([
              jar.name(),
              jar.targetAmount(),
              jar.unlockTime(),
              state.provider.getBalance(state.jarAddress),
              jar.withdrawn(),
              jar.canWithdraw(),
              jar.owner()
            ]);

          document.getElementById("jarTitle").innerHTML =
            `<a class="jar-title-link" href="${etherscanAddressUrl(state.jarAddress)}" target="_blank" rel="noopener noreferrer">${escapeHtml(name)} ↗</a>`;
          document.getElementById("jarBalance").textContent =
            `${ethers.formatEther(balance)} ETH`;

          const targetText = target === 0n
            ? "No target"
            : `${ethers.formatEther(target)} ETH target`;
          document.getElementById("progressAmount").textContent = targetText;
          document.getElementById("unlockDate").textContent =
            unlock === 0n ? "No date set" : `Until ${formatDate(unlock)}`;

          const progress = target === 0n
            ? (unlocked ? 100 : 0)
            : Math.min(100, Number(balance * 100n / target));
          document.getElementById("progressBar").style.width = `${progress}%`;

          withdrawButton.disabled = withdrawn || !unlocked;
          withdrawButton.textContent = withdrawn
            ? "Withdrawn"
            : unlocked
              ? "Withdraw"
              : "Unlock condition not met";

          await loadTips(jar);
        } catch (error) {
          setStatus(getRpcError(error) || "Could not read this jar.", "error");
        }
      }

      async function loadTips(jar = null) {
        if (!state.jarAddress) return;

        try {
          const selectedJar = jar || getJar();
          const count = await selectedJar.getTipsCount();
          const indexes = [];
          for (let index = Number(count) - 1; index >= 0 && indexes.length < 8; index--) {
            indexes.push(index);
          }

          if (indexes.length === 0) {
            tipsList.innerHTML = `<div class="empty-state"><span>Nothing in this jar yet.</span></div>`;
            return;
          }

          const tips = await Promise.all(indexes.map((index) => selectedJar.getTip(index)));
          let tipEvents = [];
          try {
            const latestBlock = await state.provider.getBlockNumber();
            const fromBlock = Math.max(0, latestBlock - 50_000);
            tipEvents = await selectedJar.queryFilter(
              selectedJar.filters.Tipped(),
              fromBlock,
              "latest",
            );
            tipEvents.reverse();
          } catch (eventError) {
            console.warn("Could not load tip transactions:", getRpcError(eventError));
          }
          tipsList.innerHTML = tips.map((tip, position) => {
            const tipEvent = tipEvents.find((event) =>
              event.args.sender.toLowerCase() === tip.sender.toLowerCase() &&
              event.args.amount === tip.amount &&
              event.args.message === tip.message
            );
            const tipLink = tipEvent
              ? etherscanTransactionUrl(tipEvent.transactionHash)
              : etherscanAddressUrl(state.jarAddress);
            return `
            <article class="tip-row">
              <div class="tip-identity">
                <span class="tip-avatar">Ξ</span>
                <div><strong>${shortenAddress(tip.sender)}</strong><time>${formatDate(tip.timestamp)}</time></div>
              </div>
              <p>${escapeHtml(tip.message || "A little thanks")}</p>
              <strong class="tip-amount">
                ${ethers.formatEther(tip.amount)} ETH
                <a class="etherscan-link" href="${tipLink}" target="_blank" rel="noopener noreferrer">View tip ↗</a>
              </strong>
            </article>
          `}).join("");
        } catch (error) {
          setStatus(getRpcError(error) || "Could not load recent tips.", "error");
        }
      }

      function escapeHtml(value) {
        const element = document.createElement("div");
        element.textContent = value;
        return element.innerHTML;
      }

      document.querySelectorAll(".amount-button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".amount-button").forEach((item) => {
            item.classList.remove("selected");
            item.setAttribute("aria-checked", "false");
          });
          button.classList.add("selected");
          button.setAttribute("aria-checked", "true");
          amountInput.value = button.dataset.amount;
        });
      });

      sendButton.addEventListener("click", async () => {
        if (!state.signer) {
          await connectWallet();
          if (!state.signer) return;
        }
        if (!state.jarAddress) {
          setStatus("Select or create a jar first.", "error");
          return;
        }

        const amount = amountInput.value;
        if (!amount || Number(amount) <= 0) {
          setStatus("Enter an amount greater than zero.", "error");
          return;
        }

        sendButton.disabled = true;
        sendButtonText.textContent = "Sending...";
        try {
          const jar = getJar(state.signer);
          const transaction = await jar.tip(messageInput.value.trim(), {
            value: ethers.parseEther(amount)
          });
          setStatus("Tip submitted. Waiting for confirmation...");
          await transaction.wait();
          setStatus("Tip delivered. Thank you!");
          messageInput.value = "";
          await loadSelectedJar();
        } catch (error) {
          setStatus(getRpcError(error), "error");
        } finally {
          sendButton.disabled = false;
          sendButtonText.textContent = "Send tip";
        }
      });

      withdrawButton.addEventListener("click", async () => {
        if (!state.signer) {
          await connectWallet();
          if (!state.signer) return;
        }
        withdrawButton.disabled = true;
        try {
          const jar = getJar(state.signer);
          const transaction = await jar.withdraw();
          setStatus("Withdrawal submitted. Waiting for confirmation...");
          await transaction.wait();
          setStatus("Funds withdrawn.");
          await loadSelectedJar();
        } catch (error) {
          setStatus(getRpcError(error), "error");
        }
      });

      document.getElementById("createJarButton").addEventListener("click", async () => {
        if (!state.signer) {
          await connectWallet();
          if (!state.signer) return;
        }
        if (!state.factoryAddress) {
          setStatus("No factory contract is configured.", "error");
          return;
        }

        const targetValue = document.getElementById("targetInput").value;
        const dateValue = document.getElementById("dateInput").value;
        const jarName = document.getElementById("jarNameInput").value.trim();
        const target = targetValue ? ethers.parseEther(targetValue) : 0n;
        const unlock = dateValue ? BigInt(Math.floor(new Date(dateValue).getTime() / 1000)) : 0n;

        if (!jarName) {
          setStatus("Enter a name for the jar.", "error");
          return;
        }
        if (target === 0n && unlock === 0n) {
          setStatus("Set a target amount or an unlock date.", "error");
          return;
        }

        try {
          const factory = getFactory(state.signer);
          const transaction = await factory.createJar(jarName, target, unlock);
          setStatus("Creating jar. Waiting for confirmation...");
          const receipt = await transaction.wait();
          const createdEvent = receipt.logs
            .map((log) => {
              try { return factory.interface.parseLog(log); } catch { return null; }
            })
            .find((event) => event?.name === "JarCreated");

          if (!createdEvent) throw new Error("Jar was created but its address could not be found.");
          state.jarAddress = createdEvent.args.jar;
          localStorage.setItem("selectedTipJarAddress", state.jarAddress);
          setStatus("Jar created.");
          await loadJars();
          await loadSelectedJar();
        } catch (error) {
          setStatus(getRpcError(error), "error");
        }
      });

      document.getElementById("refreshButton").addEventListener("click", async () => {
        await loadJars();
        await loadSelectedJar();
      });

      document.querySelectorAll(".jar-filter").forEach((button) => {
        button.addEventListener("click", async () => {
          document.querySelectorAll(".jar-filter").forEach((item) =>
            item.classList.remove("active"));
          button.classList.add("active");

          state.jarFilter = button.dataset.filter;
          const nameInput = document.getElementById("nameFilter");
          nameInput.hidden = state.jarFilter !== "name";
          if (state.jarFilter === "name") nameInput.focus();
          await loadJars();
        });
      });

      document.getElementById("nameFilter").addEventListener("input", async (event) => {
        state.nameFilter = event.target.value.trim();
        await loadJars();
      });

      connectButton.addEventListener("click", connectWallet);
      if (state.factoryAddress) {
        loadJars();
      }
      if (state.jarAddress) {
        loadSelectedJar();
      }
      setInterval(() => {
        if (state.jarAddress) loadSelectedJar();
      }, 15_000);
      if (window.ethereum) {
        window.ethereum.on("accountsChanged", connectWallet);
      }
    </script>
  </body>
</html>
